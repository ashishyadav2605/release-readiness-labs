name: Release Pipeline

on:
  push:
    branches:
      - new

jobs:
  deploy-production:
    needs: validate-release
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to production
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Tests
        run: |
          npm install --prefix app
          npm test --prefix app
