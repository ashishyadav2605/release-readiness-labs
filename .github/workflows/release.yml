name: Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: 20

      - name: Validate release
        run: node -e "const r=require('./release/release.json'); if(r.version!='2.3.0') process.exit(1);
      
      - name: Run tests
        working-directory: app
        run: |
          npm install
          npm test

  deploy-production:
    needs: validate_release
    if: github.event.name == 'workflow.dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify release
        run: echo "Release 2.3.0 validated; production deployment not executed"
